# Proposed configuration. Host Node /usr/bin/node v22.22.1 is confirmed. Recheck upstream port,
# DNS, existing ClimbPass location and current NGINX snippets before installation.
server {
    listen 80;
    server_name climb-pass.app.shipachev.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name climb-pass.app.shipachev.com;
    ssl_certificate /etc/letsencrypt/live/app.shipachev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.shipachev.com/privkey.pem;
    client_max_body_size 8m;
    access_log /var/log/nginx/climbpass-access.log;
    error_log /var/log/nginx/climbpass-error.log;

    location ~ (^|/)(\.|history\.json$|package(?:-lock)?\.json$|.*\.(?:sql|sqlite3?|env|bak)$) {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:9083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
