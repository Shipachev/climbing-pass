<!-- @dsCard group="Components" viewport="700x900" name="Training — hero, steps, progress, history" -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../components/_card-boot.js"></script>
<style>body{padding:20px;background:#fff}</style></head><body><div id="root"></div>
<script type="text/babel">
bootDS().then(function (NS) {

  const { ActiveTrainingCard, MembershipStrip, ProgressSegments, SectionHeader, StepRow, StepCard, StatusLabel, Stat, HistoryRow, ActionBar, Button } = NS;
  const st = ['done','done','done','done','todo','todo','todo','todo','todo'];
  function App(){ const [s,setS]=React.useState('todo'); const [note,setNote]=React.useState('Все серии выполнены, работа ног стала точнее');
    return <div style={{display:'grid',gridTemplateColumns:'320px 1fr',gap:20,alignItems:'start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <ActiveTrainingCard title="Техника и выносливость" statuses={st} currentStep="Лазание на выносливость" />
        <MembershipStrip left={5} total={8} validUntil="30 ноября" />
        <div><HistoryRow day="31" month="окт" title="Сила и техника" score="8/9" status="finished" /><HistoryRow day="24" month="окт" title="Сила и техника" score="5/9" status="unfinished" /><HistoryRow day="2" month="ноя" title="Техника и выносливость" score="4/9" status="active" /></div>
        <ActiveTrainingCard variant="idle" />
      </div>
      <div style={{border:'1px solid var(--border-default)',borderRadius:16,overflow:'hidden'}}>
        <div style={{padding:16,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}><Stat label="План" value="90 минут" /><Stat label="Выполнено" value="4 из 9" /><ProgressSegments statuses={['done','done','done','done','skipped','todo','todo','todo','todo']} style={{gridColumn:'1 / -1'}} /></div>
        <SectionHeader title="Основная часть" count="1/4" />
        <StepRow index={4} title="Тихие ноги" meta="4 трассы" status="done" />
        <StepCard index={5} total={9} title="Лазание на выносливость" meta="3 серии по 4 трассы" status={s} current
          description="Выбирай трассы комфортной сложности. Лезь плавно, следи за работой ног. Между сериями отдыхай до восстановления дыхания."
          prevNote={{date:'28 октября',text:'Третья серия далась тяжело. В следующий раз начать спокойнее.'}}
          note={note} onNoteChange={e=>setNote(e.target.value)} onSwipeDone={()=>setS('done')} onSwipeSkip={()=>setS('skipped')} />
        <StepRow index={6} title="Траверс с перехватами" meta="2 подхода по 5 минут" status="skipped" />
        <StepRow index={7} title="Висы на зацепах" meta="6 подходов по 10 секунд" />
        <ActionBar position="static" safeBottom={0}>
          <Button variant="secondary" size="lg" icon="skip_next" fullWidth onClick={()=>setS('skipped')}>Пропустить</Button>
          <Button size="lg" icon="check" fullWidth onClick={()=>setS('done')}>Выполнено</Button>
        </ActionBar>
      </div>
    </div>; }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
