<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:118px}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:700 12px/1.3 var(--font-sans);margin-top:6px}.v{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="row" style="gap:16px"><div style="width:150px;height:84px;border:1px solid var(--border-card);border-radius:16px;padding:10px;box-sizing:border-box" class="v">border-card<br>cards</div><div style="width:150px;height:84px;background:var(--surface-inverse);border-radius:16px;padding:10px;box-sizing:border-box;color:#A8A8A8" class="v">surface-inverse<br>hero</div><div style="width:150px;height:84px;background:var(--surface-muted);border-radius:12px;padding:4px;box-sizing:border-box"><div style="background:#fff;border-radius:9px;height:40px;box-shadow:var(--shadow-selected)" class="v">&nbsp;shadow-selected</div></div><div style="width:150px;height:84px;background:var(--surface-scrim);border-radius:16px;padding:10px;box-sizing:border-box;color:#fff" class="v">surface-scrim<br>sheets</div></div></body></html>
