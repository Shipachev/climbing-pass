<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:118px}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:700 12px/1.3 var(--font-sans);margin-top:6px}.v{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:4px;margin-bottom:8px"><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-skipped)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo)"></span></div>
 <div style="display:flex;gap:4px;margin-bottom:18px;background:#0F0F0F;padding:10px;border-radius:10px"><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-done)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-skipped-inverse)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo-inverse)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo-inverse)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo-inverse)"></span><span style="flex:1;height:10px;border-radius:2px;background:var(--progress-todo-inverse)"></span></div>
 <div class="row" style="gap:28px;font:600 14px var(--font-sans)"><span style="display:flex;gap:6px;align-items:center"><span class="cp-icon" style="font-variation-settings:'FILL' 1;color:var(--status-done)">check_circle</span>Выполнен</span><span style="display:flex;gap:6px;align-items:center;color:var(--text-secondary)"><span class="cp-icon" style="font-variation-settings:'FILL' 1;color:var(--status-skipped)">do_not_disturb_on</span>Пропущен</span><span style="display:flex;gap:6px;align-items:center;color:var(--text-secondary)"><span class="cp-icon" style="color:var(--status-todo)">radio_button_unchecked</span>Не отмечен</span><span style="display:flex;gap:6px;align-items:center;color:var(--status-current)"><span class="cp-icon" style="font-variation-settings:'FILL' 1">play_arrow</span>Сейчас</span></div></body></html>
