<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:118px}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:700 12px/1.3 var(--font-sans);margin-top:6px}.v{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cp-ink)"></div><div class="n">Ink</div><div class="v">--cp-ink<br>#0F0F0F</div></div><div class="sw"><div class="chip" style="background:var(--cp-gray-600)"></div><div class="n">Gray 600 · secondary</div><div class="v">--cp-gray-600<br>#5C5C5C</div></div><div class="sw"><div class="chip" style="background:var(--cp-gray-300)"></div><div class="n">Gray 300</div><div class="v">--cp-gray-300<br>#BDBDBD</div></div><div class="sw"><div class="chip" style="background:var(--cp-gray-200)"></div><div class="n">Gray 200 · border</div><div class="v">--cp-gray-200<br>#E6E6E6</div></div><div class="sw"><div class="chip" style="background:var(--cp-gray-100)"></div><div class="n">Gray 100 · band</div><div class="v">--cp-gray-100<br>#F2F2F2</div></div></div></body></html>
