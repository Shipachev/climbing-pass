<!-- @dsCard group="Colors" viewport="700x150" name="Semantic surfaces & text" subtitle="Use these aliases in product code" -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:#fff;font-family:var(--font-sans);color:var(--text-primary)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:118px}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06)}.n{font:700 12px/1.3 var(--font-sans);margin-top:6px}.v{font:500 11px/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="n">surface-inverse</div><div class="v">--surface-inverse<br>hero block</div></div><div class="sw"><div class="chip" style="background:var(--surface-current)"></div><div class="n">surface-current</div><div class="v">--surface-current<br>open step</div></div><div class="sw"><div class="chip" style="background:var(--action-secondary)"></div><div class="n">action-secondary</div><div class="v">--action-secondary<br>grey buttons</div></div><div class="sw"><div class="chip" style="background:var(--text-danger)"></div><div class="n">text-danger</div><div class="v">--text-danger<br>#B3261E</div></div><div class="sw"><div class="chip" style="background:var(--text-positive)"></div><div class="n">text-positive</div><div class="v">--text-positive<br>#2E7D32</div></div></div></body></html>
