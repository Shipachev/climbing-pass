<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />

        <title>ClimbPass</title>
        <meta
            name="description"
            content="Учёт абонементов на скалодром: остаток посещений и срок действия всегда под рукой."
        />
        <link rel="manifest" href="manifest.json" />

        <meta name="theme-color" content="#ff6b2c" />

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="ClimbPass" />

        <link rel="apple-touch-icon" href="icon-192.png" />
        <style>
            * {
                user-select: none; /* стандарт */
                -webkit-user-select: none; /* Safari / iOS */
                -moz-user-select: none; /* Firefox */
                -ms-user-select: none; /* IE/Edge */
            }

            :root {
                --bg: #f2f2f7;
                --card: #ffffff;
                --accent: #ff6b2c;
                --accent2: #ff9a6c;
                --text: #1c1c1e;
                --muted: #8e8e93;
                --border: #e5e5ea;
            }

            body {
                margin: 0;
                background: var(--bg);
                font-family:
                    -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
                color: var(--text);
                -webkit-touch-callout: none; /* убирает контекстное меню при долгом тапе на iOS */
            }

            .container {
                max-width: 520px;
                margin: auto;
                padding: 20px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 20px;
            }

            .card {
                background: white;
                border-radius: 22px;
                padding: 22px;
                margin-bottom: 18px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            }

            .small {
                font-size: 14px;
                color: var(--muted);
            }

            input,
            select {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                padding: 12px;
                border-radius: 12px;
                border: 1px solid var(--border);
                background: #f9f9f9;
                margin-bottom: 12px;
                font-size: 16px;
                display: block;
                text-align: left;
                text-align-last: left;
            }

            input[type='date'],
            input[type='number'],
            select {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                -webkit-appearance: none;
                appearance: none;
            }

            button {
                border: none;
                border-radius: 14px;
                padding: 14px;
                font-size: 16px;
                cursor: pointer;
            }

            .primary {
                background: var(--accent);
                color: white;
                width: 100%;
            }

            .secondary {
                background: #f2f2f7;
            }

            .visit {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px solid var(--border);
            }

            .delete {
                background: none;
                padding: 0;
            }

            .delete svg {
                width: 18px;
                height: 18px;
                fill: black;
            }

            .edit-buttons {
                display: flex;
                gap: 12px;
                margin-top: 14px;
            }

            .edit-buttons button {
                flex: 1;
            }

            .pass-card {
                background: linear-gradient(
                    135deg,
                    var(--accent),
                    var(--accent2)
                );
                color: white;

                border-radius: 24px;

                padding: 24px;

                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);

                margin-bottom: 20px;

                transition: background 0.4s;
            }

            .pass-card.warn {
                background: linear-gradient(135deg, #e53e3e, #fc8181);
            }

            .pass-top {
                display: flex;
                justify-content: space-between;
            }

            .pass-title {
                font-size: 18px;
                font-weight: 600;
            }

            .pass-dates {
                font-size: 14px;
                opacity: 0.9;
            }

            .pass-visits {
                font-size: 48px;
                font-weight: 700;
                margin-top: 14px;
            }

            .pass-label {
                font-size: 14px;
                opacity: 0.9;
            }

            .progress-bar {
                margin-top: 16px;
                height: 10px;
                background: rgba(255, 255, 255, 0.25);
                border-radius: 8px;
                overflow: hidden;
            }

            .progress-fill {
                height: 100%;
                background: white;
                border-radius: 8px;
                transition: width 0.4s;
            }

            .pass-actions {
                margin-top: 18px;
            }

            .pass-edit {
                background: none;
                border: none;
                color: white;
            }

            .footer-help {
                text-align: center;
                margin-top: 30px;
                margin-bottom: 40px;
                font-size: 14px;
                color: var(--muted);
            }

            .footer-help a {
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
            }

            .footer-actions {
                display: flex;
                gap: 10px;
                margin-top: 14px;
            }

            .footer-actions button {
                flex: 1;
                padding: 11px;
                font-size: 14px;
                border-radius: 12px;
                background: white;
                color: var(--text);
                border: 1px solid var(--border);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            }

            .footer-actions button:active {
                background: var(--bg);
            }

            .import-area {
                margin-top: 12px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .import-area textarea {
                width: 100%;
                box-sizing: border-box;
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 12px;
                font-size: 13px;
                font-family: monospace;
                background: #f9f9f9;
                resize: vertical;
                min-height: 80px;
                color: var(--text);
                user-select: text;
                -webkit-user-select: text;
            }

            .import-area .row {
                display: flex;
                gap: 8px;
            }

            .import-area .row button {
                flex: 1;
            }

            .toast {
                position: fixed;
                bottom: 28px;
                left: 50%;
                transform: translateX(-50%);
                background: #1c1c1e;
                color: white;
                padding: 10px 20px;
                border-radius: 20px;
                font-size: 14px;
                white-space: nowrap;
                z-index: 9999;
                animation:
                    toastIn 0.2s ease,
                    toastOut 0.3s ease 1.7s forwards;
                pointer-events: none;
            }

            @keyframes toastIn {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
            }

            @keyframes toastOut {
                to {
                    opacity: 0;
                    transform: translateX(-50%) translateY(10px);
                }
            }

            .help-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.45);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                box-sizing: border-box;
                z-index: 1000;
            }

            .help-modal {
                background: white;
                border-radius: 18px;
                padding: 22px;
                max-width: 420px;
                width: 90%;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            }

            .help-modal h3 {
                margin-top: 0;
            }

            .help-close {
                margin-top: 16px;
                width: 100%;
            }

            .help-icon {
                display: inline-block;
                width: 18px;
                height: 18px;
                vertical-align: -3px;
                margin: 0 4px;
            }

            .help-icon svg {
                width: 100%;
                height: 100%;
                fill: currentColor;
            }

            /* кнопка «Отметить посещение» */
            .btn-visit {
                transition:
                    transform 0.1s,
                    box-shadow 0.1s;
            }

            .btn-visit:active {
                transform: scale(0.96);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            }

            @keyframes visitAdded {
                0% {
                    transform: scale(1);
                }
                40% {
                    transform: scale(1.06);
                }
                100% {
                    transform: scale(1);
                }
            }

            .btn-visit.pop {
                animation: visitAdded 0.3s ease;
            }

            /* раскрываемый архив */
            .archive-row {
                cursor: pointer;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 0;
                border-bottom: 1px solid var(--border);
            }

            .archive-row:last-child {
                border-bottom: none;
            }

            .archive-row .chevron {
                font-size: 11px;
                color: var(--muted);
                transition: transform 0.2s;
                display: inline-block;
            }

            .archive-row.open .chevron {
                transform: rotate(180deg);
            }

            .archive-detail {
                padding: 6px 0 10px 0;
                border-bottom: 1px solid var(--border);
            }

            .archive-detail:last-child {
                border-bottom: none;
            }

            .archive-visit-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 13px;
                color: var(--muted);
                padding: 3px 0;
            }

            .archive-visit-item .delete svg {
                width: 16px;
                height: 16px;
                fill: var(--muted);
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div id="app"></div>
        </div>

        <script>
            let APP_VERSION = '';
            if ('serviceWorker' in navigator) {
                // ready дожидается активного SW, в том числе при первом открытии
                navigator.serviceWorker.ready.then((reg) => {
                    const sw = reg.active;
                    if (sw?.scriptURL) {
                        fetch(sw.scriptURL)
                            .then((r) => r.text())
                            .then((text) => {
                                const m = text.match(
                                    /CACHE_VERSION\s*=\s*['"]([^'"]+)['"]/,
                                );
                                if (m) {
                                    APP_VERSION = m[1];
                                    const el =
                                        document.getElementById('appVersion');
                                    if (el) el.textContent = 'v' + APP_VERSION;
                                }
                            });
                    }
                });
            }

            let data = JSON.parse(localStorage.getItem('climb_pass') || '[]');
            let expandedArchiveId = null;

            function save() {
                localStorage.setItem('climb_pass', JSON.stringify(data));
            }

            // даты храним строками YYYY-MM-DD в локальном времени:
            // toISOString() даёт дату по UTC, и после полуночи по Москве получался вчерашний день
            function toISODate(d) {
                let m = String(d.getMonth() + 1).padStart(2, '0');
                let day = String(d.getDate()).padStart(2, '0');
                return `${d.getFullYear()}-${m}-${day}`;
            }

            function today() {
                return toISODate(new Date());
            }

            function plus30() {
                let d = new Date();
                d.setDate(d.getDate() + 30);
                return toISODate(d);
            }

            function formatDate(d) {
                return d.split('-').reverse().join('.');
            }

            function daysLeft(end) {
                let [y, m, d] = end.split('-').map(Number);
                let now = new Date();
                let startOfToday = new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate(),
                );
                let diff = (new Date(y, m - 1, d) - startOfToday) / 86400000;
                return Math.max(0, Math.round(diff));
            }

            function plural(n, one, few, many) {
                let rule = new Intl.PluralRules('ru').select(n);
                return rule === 'one' ? one : rule === 'few' ? few : many;
            }

            function activePass() {
                return data.find((p) => p.status === 'active');
            }

            // дата окончания входит в срок действия
            function isFinished(p) {
                return p.end < today() || p.visits.length >= p.total;
            }

            function archiveCheck() {
                let p = activePass();

                if (!p) return;

                if (isFinished(p)) {
                    p.status = 'archived';
                    save();
                }
            }

            function createPass() {
                let start = document.getElementById('startInput').value;
                let end = document.getElementById('endInput').value;

                if (!start || !end) {
                    showToast('❌ Укажите даты');
                    return;
                }
                if (end < start) {
                    showToast('❌ Окончание раньше начала');
                    return;
                }
                if (end < today()) {
                    showToast('❌ Дата окончания уже прошла');
                    return;
                }

                data.push({
                    id: Date.now(),
                    start,
                    end,
                    total: parseInt(
                        document.getElementById('totalInput').value,
                    ),
                    visits: [],
                    status: 'active',
                });

                save();
                render();
            }

            function addVisit() {
                let p = activePass();
                if (!p) return;
                if (p.visits.length >= p.total) return;

                let todayStr = today();
                if (p.visits.includes(todayStr)) {
                    if (
                        !confirm(
                            'Вы уже отметили посещение сегодня. Добавить ещё одно?',
                        )
                    )
                        return;
                }

                p.visits.push(todayStr);
                save();
                render();

                // последнее посещение — абонемент ушёл в архив, карточки больше нет
                if (p.status === 'archived') {
                    showToast('🏁 Абонемент завершён');
                    return;
                }

                // анимация кнопки
                requestAnimationFrame(() => {
                    let btn = document.querySelector('.btn-visit');
                    if (btn) {
                        btn.classList.remove('pop');
                        void btn.offsetWidth;
                        btn.classList.add('pop');
                    }
                });
            }

            function deletePassVisit(passId, visitIndex) {
                let p = data.find((x) => x.id === passId);
                if (!p) return;
                if (!confirm('Удалить это посещение?')) return;

                p.visits.splice(visitIndex, 1);

                // случайно отмеченное последнее посещение: абонемент снова действует
                if (p.status === 'archived' && !activePass() && !isFinished(p)) {
                    p.status = 'active';
                    expandedArchiveId = null;
                    showToast('Абонемент снова активен');
                }

                save();
                render();
            }

            // посещения от новых к старым, с индексом в исходном массиве для удаления
            function sortedVisits(p) {
                return p.visits
                    .map((date, origIndex) => ({ date, origIndex }))
                    .sort((a, b) => (a.date < b.date ? 1 : -1));
            }

            const TRASH_ICON =
                '<svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm2 3h14l-1.5 12.5H6.5L5 9z"/></svg>';

            function renderCreate() {
                return `
<div class="card">

<h3>Новый абонемент</h3>

<div class="small">Дата начала</div>
<input id="startInput" type="date" value="${today()}">

<div class="small">Дата окончания</div>
<input id="endInput" type="date" value="${plus30()}">

<div class="small">Количество посещений</div>
<select id="totalInput">
<option value="1">1</option>
<option value="4">4</option>
<option value="8" selected>8</option>
</select>

<button class="primary" onclick="createPass()">Давай-давай-давай!</button>

</div>
`;
            }

            function renderPassCard(p) {
                let remain = p.total - p.visits.length;

                let percent = (remain / p.total) * 100;

                let days = daysLeft(p.end);
                let isUrgent = remain <= 1 || days <= 3;
                let warnClass = isUrgent ? ' warn' : '';

                // remain === 0 здесь не бывает: такой абонемент уже в архиве
                let warnMsg = '';
                if (remain === 1) {
                    warnMsg =
                        '<div style="margin-top:10px;font-size:13px;opacity:0.95;font-weight:600;">⚠️ Осталось последнее посещение</div>';
                } else if (days === 0) {
                    warnMsg =
                        '<div style="margin-top:10px;font-size:13px;opacity:0.95;font-weight:600;">⚠️ Абонемент истекает сегодня</div>';
                } else if (days <= 3) {
                    warnMsg = `<div style="margin-top:10px;font-size:13px;opacity:0.95;font-weight:600;">⚠️ Абонемент истекает через ${days} ${plural(days, 'день', 'дня', 'дней')}</div>`;
                }

                let daysText =
                    days === 0
                        ? 'последний день'
                        : `${days} ${plural(days, 'день остался', 'дня осталось', 'дней осталось')}`;

                let visitsHTML = sortedVisits(p)
                    .map(
                        ({ date, origIndex }) => `
<div class="visit">
  <div>${formatDate(date)}</div>
  <button class="delete" aria-label="Удалить посещение" onclick="deletePassVisit(${p.id}, ${origIndex})">${TRASH_ICON}</button>
</div>`,
                    )
                    .join('');

                return `

<div class="pass-card${warnClass}">

<div class="pass-top">

<div>

<div class="pass-title">Абонемент</div>

<div class="pass-dates">${formatDate(p.start)} — ${formatDate(p.end)}</div>

<div class="pass-dates">${daysText}</div>

</div>

<button class="pass-edit" aria-label="Редактировать абонемент" onclick="editPass()">

<svg viewBox="0 0 24 24" width="18" height="18">

<path fill="currentColor" d="M3 17.25V21h3.75l11-11.03-3.75-3.75L3 17.25z"/>

</svg>

</button>

</div>

<div class="pass-visits">${remain}</div>

<div class="pass-label">осталось посещений</div>

<div class="progress-bar">

<div class="progress-fill" style="width:${percent}%"></div>

</div>

${warnMsg}

<div class="pass-actions">

<button class="primary btn-visit" onclick="addVisit()">Отметить посещение</button>

</div>

</div>

<div class="card">

<h3>История посещений</h3>

${visitsHTML || '<div class="small">Нет посещений</div>'}

</div>

`;
            }

            function toggleArchive(id) {
                expandedArchiveId = expandedArchiveId === id ? null : id;
                render();
            }

            function renderArchive() {
                let archive = data
                    .filter((x) => x.status === 'archived')
                    .sort((a, b) => (a.end < b.end ? 1 : -1));
                if (!archive.length) {
                    return `<div class="card"><h3>Архив абонементов</h3><div class="small">Архив пуст</div></div>`;
                }

                // #8: сортируем визиты по убыванию внутри каждого архивного абонемента
                let html = archive
                    .map((a) => {
                        let isOpen = expandedArchiveId === a.id;
                        let openClass = isOpen ? ' open' : '';

                        let detailHTML = '';
                        if (isOpen) {
                            let sorted = sortedVisits(a);
                            if (sorted.length) {
                                detailHTML = `<div class="archive-detail">${sorted
                                    .map(
                                        ({ date, origIndex }) => `
<div class="archive-visit-item">
  <span>📅 ${formatDate(date)}</span>
  <button class="delete" aria-label="Удалить посещение" onclick="deletePassVisit(${a.id}, ${origIndex})">${TRASH_ICON}</button>
</div>`,
                                    )
                                    .join('')}</div>`;
                            } else {
                                detailHTML = `<div class="archive-detail"><div class="archive-visit-item">Посещений не было</div></div>`;
                            }
                        }

                        return `
<div class="archive-row${openClass}" onclick="toggleArchive(${a.id})">
  <div>
    <div style="font-size:14px;">${formatDate(a.start)} — ${formatDate(a.end)}</div>
    <div class="small">${a.visits.length} из ${a.total} ${plural(a.total, 'посещения', 'посещений', 'посещений')}</div>
  </div>
  <span class="chevron">▼</span>
</div>
${detailHTML}`;
                    })
                    .join('');

                return `<div class="card"><h3>Архив абонементов</h3>${html}</div>`;
            }

            function showToast(msg) {
                document
                    .querySelectorAll('.toast')
                    .forEach((el) => el.remove());
                let t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2100);
            }

            function exportData() {
                let json = JSON.stringify(data, null, 2);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard
                        .writeText(json)
                        .then(() => {
                            showToast('✅ Скопировано в буфер обмена');
                        })
                        .catch(() => showExportFallback(json));
                } else {
                    showExportFallback(json);
                }
            }

            function showExportFallback(json) {
                // на iOS clipboard API часто недоступен — показываем textarea для ручного копирования
                let existing = document.getElementById('exportFallback');
                if (existing) {
                    existing.remove();
                    return;
                }
                let wrap = document.createElement('div');
                wrap.id = 'exportFallback';
                wrap.className = 'import-area';
                wrap.style.marginTop = '12px';
                wrap.innerHTML = `
                    <div class="small" style="margin-bottom:4px;">Выделите всё и скопируйте:</div>
                    <textarea readonly onclick="this.select()"></textarea>`;
                document.getElementById('exportImportCard').appendChild(wrap);
                let ta = wrap.querySelector('textarea');
                ta.value = json;
                ta.select();
            }

            let importVisible = false;

            function toggleImport() {
                importVisible = !importVisible;
                render();
                if (importVisible) {
                    requestAnimationFrame(() => {
                        let ta = document.getElementById('importTextarea');
                        if (ta) ta.focus();
                    });
                }
            }

            function isDateString(v) {
                return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
            }

            // поля абонемента попадают в разметку без экранирования,
            // поэтому пропускаем только ожидаемые типы и форматы
            function isValidPass(p) {
                return (
                    p !== null &&
                    typeof p === 'object' &&
                    Number.isInteger(p.id) &&
                    isDateString(p.start) &&
                    isDateString(p.end) &&
                    Number.isInteger(p.total) &&
                    p.total > 0 &&
                    Array.isArray(p.visits) &&
                    p.visits.every(isDateString) &&
                    (p.status === 'active' || p.status === 'archived')
                );
            }

            function doImport() {
                let ta = document.getElementById('importTextarea');
                if (!ta) return;

                let parsed;
                try {
                    parsed = JSON.parse(ta.value.trim());
                } catch {
                    showToast('❌ Неверный формат JSON');
                    return;
                }

                if (!Array.isArray(parsed) || !parsed.every(isValidPass)) {
                    showToast('❌ Неверный формат данных');
                    return;
                }

                if (
                    data.length &&
                    !confirm('Заменить все текущие данные импортированными?')
                )
                    return;

                data = parsed.map(({ id, start, end, total, visits, status }) => ({
                    id,
                    start,
                    end,
                    total,
                    visits,
                    status,
                }));
                save();
                importVisible = false;
                render();
                showToast('✅ Данные импортированы');
            }

            function renderFooter() {
                let importBlock = importVisible
                    ? `

  <div class="row">

    <button class="secondary" onclick="toggleImport()">Отмена</button>
  </div>
</div>`
                    : '';

                return `
<div class="footer-help">
  <a href="#" onclick="openHelp();return false;"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;margin-right:4px;fill:currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z"/></svg>Инструкция</a>
  <span style="margin:0 8px;opacity:0.3;">·</span>
  <a href="https://t.me/shipachev" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px;margin-right:4px;fill:currentColor;"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>@shipachev</a>
</div>
<div class="card" id="exportImportCard">
  <div style="font-size:15px;font-weight:600;margin-bottom:4px;">Резервная копия</div>
  <div class="small">Экспортируйте данные перед сменой браузера или устройства</div>
  <div class="footer-actions">
    <button onclick="exportData()">📤 Экспорт</button>
    <button onclick="toggleImport()">${importVisible ? '✕ Отмена' : '📥 Импорт'}</button>

            }

            function render() {
                archiveCheck();

                let p = activePass();

                let html = '<h1>🧗 ClimbPass</h1>';

                if (p) {
                    html += renderPassCard(p);
                } else {
                    html += renderCreate();
                }

                html += renderArchive();
                html += renderFooter();

                document.getElementById('app').innerHTML = html;

                // восстанавливаем версию после перерисовки
                if (APP_VERSION) {
                    const el = document.getElementById('appVersion');
                    if (el) el.textContent = 'v' + APP_VERSION;
                }
            }

            function editPass() {
                let p = activePass();

                if (!p) return;

                // после импорта количество может быть не из 1/4/8 — не теряем его
                let totals = [...new Set([1, 4, 8, p.total])].sort((a, b) => a - b);
                let totalOptions = totals
                    .map(
                        (n) =>
                            `<option value="${n}" ${p.total === n ? 'selected' : ''}>${n}</option>`,
                    )
                    .join('');

                document.getElementById('app').innerHTML = `

<div class="card">

<h3>Редактировать абонемент</h3>

<div class="small">Дата начала</div>
<input id="editStart" type="date" value="${p.start}">

<div class="small">Дата окончания</div>
<input id="editEnd" type="date" value="${p.end}">

<div class="small">Количество посещений</div>
<select id="editTotal">
${totalOptions}
</select>

<div class="edit-buttons">

<button class="primary" onclick="saveEdit()">Сохранить</button>

<button class="secondary" onclick="render()">Отмена</button>

</div>

</div>

`;
            }

            function saveEdit() {
                let p = activePass();
                if (!p) return;

                let start = document.getElementById('editStart').value;
                let end = document.getElementById('editEnd').value;
                let total = parseInt(document.getElementById('editTotal').value);

                if (!start || !end) {
                    showToast('❌ Укажите даты');
                    return;
                }
                if (end < start) {
                    showToast('❌ Окончание раньше начала');
                    return;
                }
                let used = p.visits.length;
                if (total < used) {
                    showToast(
                        `❌ Уже отмечено ${used} ${plural(used, 'посещение', 'посещения', 'посещений')}`,
                    );
                    return;
                }
                if (
                    isFinished({ ...p, end, total }) &&
                    !confirm('Абонемент будет завершён и перенесён в архив. Сохранить?')
                )
                    return;

                p.start = start;
                p.end = end;
                p.total = total;

                save();

                render();
            }

            function openHelp() {
                const html = `

    <div class="help-modal" onclick="event.stopPropagation()">

                document.body.insertAdjacentHTML('beforeend', html);
            }

            function closeHelp() {
                const el = document.querySelector('.help-overlay');
                if (el) el.remove();
            }

            render();
        </script>
        <script>
            if ('serviceWorker' in navigator) {
                // новый SW сам вызывает skipWaiting() и clients.claim(),
                // поэтому достаточно перезагрузиться, когда он возьмёт управление
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    // check for updates on load
                    reg.update();
                });

                // при первом открытии контроллера ещё нет: claim() — это не обновление
                let hadController = !!navigator.serviceWorker.controller;
                let reloading = false;

                navigator.serviceWorker.addEventListener(
                    'controllerchange',
                    () => {
                        if (!hadController) {
                            hadController = true;
                            return;
                        }
                        if (reloading) return;
                        reloading = true;

                        showToast('🆕 Обновление установлено…');
                        setTimeout(() => window.location.reload(), 1200);
                    },
                );
            }
        </script>
    </body>
</html>
